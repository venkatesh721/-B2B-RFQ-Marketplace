services:
  - type: web
    name: b2b-rfq-marketplace
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_demo_data
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: b2b-rfq-marketplace-hphn.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://bidmarket4545.vercel.app
